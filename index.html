<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Changer</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container">
    <p class="eyebrow">A LITTLE COLOR PLAY</p>
    <h1>Color Changer</h1>
    <p class="description">One click. A fresh shade. See what comes next.</p>
    <div id="color-box" aria-label="Color preview"></div>
    <p id="color-code" aria-live="polite">#6366F1</p>
    <button id="change-color-btn" type="button">Change Color</button>
  </div>
</body>
</html>
